repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
        name: enforce LF line endings
        args: ["--fix=lf"]
        exclude: '\.(bat|cmd|ps1)$'
      - id: mixed-line-ending
        alias: mixed-line-ending-crlf
        name: enforce CRLF for Windows scripts
        args: ["--fix=crlf"]
        files: '\.(bat|cmd|ps1)$'

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (uv)
        entry: uv run --no-sync ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format-check
        name: ruff format --check (uv)
        entry: uv run --no-sync ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
