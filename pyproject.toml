[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "it-rpa-suite"
version = "0.6.0"
description = "Enterprise IT Desktop & Browser Automation Suite with Offline Sandbox"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "lanjz" },
]
keywords = [
    "rpa",
    "automation",
    "playwright",
    "tkinter",
    "windows",
    "pywinauto",
    "it-operations",
    "desktop-app",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "playwright>=1.40.0",
    "pywin32>=306; sys_platform == 'win32'",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/lanjztaipei/it-rpa-suite"
Repository = "https://github.com/lanjztaipei/it-rpa-suite"
Issues = "https://github.com/lanjztaipei/it-rpa-suite/issues"
Changelog = "https://github.com/lanjztaipei/it-rpa-suite/blob/main/CHANGELOG.md"

[project.scripts]
it-rpa-suite = "it_rpa_suite.app.bootstrap:main"

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.8.0",
    "pyinstaller>=6.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=it_rpa_suite --cov-report=term-missing"
markers = [
    "unit: fast unit tests with no external UI or browser dependencies",
    "gui: tests that create Tkinter widgets or inspect Windows UIA controls",
    "e2e: end-to-end Playwright browser tests against the built-in mock server",
]

[tool.coverage.run]
source = ["src/it_rpa_suite"]
omit = [
    "src/it_rpa_suite/mock_server/pages.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 38

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "tools"]
extend-exclude = ["ITRPASuite", "released", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
warn_unused_configs = false
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "win32api",
    "win32com",
    "win32com.*",
    "win32con",
    "win32crypt",
    "win32gui",
    "pythoncom",
    "pywintypes",
    "pywinauto",
    "pywinauto.*",
]
ignore_missing_imports = true
